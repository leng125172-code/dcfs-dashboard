name: whaledeck

x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: "5"
      compress: "true"

services:
  gateway:
    <<: *service-defaults
    container_name: whaledeck-gateway
    build:
      context: .
      dockerfile: deploy/gateway/Dockerfile
    ports:
      - "127.0.0.1:${WHALEDECK_GATEWAY_UPSTREAM_PORT:-18080}:8080"
      - "127.0.0.1:${AUTHENTIK_UPSTREAM_PORT:-18081}:8081"
    environment:
      WHALEDECK_TITLE: ${WHALEDECK_TITLE:-WhaleDeck 协同平台}
      WHALEDECK_BACKEND_VERSION: ${WHALEDECK_BACKEND_VERSION:-0.1.0}
      WHALEDECK_API_BASE_URL: /api/v1
      WHALEDECK_AUTHENTIK_URL: ${WHALEDECK_AUTHENTIK_URL:-http://192.168.22.19:8081}
      WHALEDECK_GITLAB_URL: ${WHALEDECK_GITLAB_URL:-http://192.168.22.19:8082}
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    depends_on:
      - api
    networks:
      - whaledeck_frontend
      - authentik_frontend
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512m

  api:
    <<: *service-defaults
    container_name: whaledeck-api
    build:
      context: .
      dockerfile: src/WhaleDeck.Api/Dockerfile
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__WhaleDeck: Host=postgres;Port=5432;Database=${WHALEDECK_DB_NAME:-whaledeck};Username=${WHALEDECK_DB_USER:-whaledeck};Password=${WHALEDECK_DB_PASSWORD:?set WHALEDECK_DB_PASSWORD};Application Name=whaledeck
      Authentication__Oidc__Enabled: "true"
      Authentication__Oidc__Authority: ${WHALEDECK_OIDC_AUTHORITY:?set WHALEDECK_OIDC_AUTHORITY}
      Authentication__Oidc__ClientId: ${WHALEDECK_OIDC_CLIENT_ID:?set WHALEDECK_OIDC_CLIENT_ID}
      Authentication__Oidc__ClientSecret: ${WHALEDECK_OIDC_CLIENT_SECRET:?set WHALEDECK_OIDC_CLIENT_SECRET}
      Valkey__Endpoint: valkey:6379
      Valkey__User: ${WHALEDECK_VALKEY_USER:-whaledeck}
      Valkey__Password: ${WHALEDECK_VALKEY_PASSWORD:?set WHALEDECK_VALKEY_PASSWORD}
      Agent__SocketPath: /run/whaledeck/agent.sock
      Agent__CapabilityKeyFile: /run/secrets/agent-capability.key
      Authentication__Authentik__ApiBaseUrl: http://authentik:9000/api/v3/
      Authentication__Authentik__ApiToken: ${WHALEDECK_AUTHENTIK_API_TOKEN:?set WHALEDECK_AUTHENTIK_API_TOKEN}
      Authentication__Authentik__AdministratorGroupId: ${WHALEDECK_AUTHENTIK_ADMIN_GROUP_ID:?set WHALEDECK_AUTHENTIK_ADMIN_GROUP_ID}
    volumes:
      - /run/whaledeck/agent.sock:/run/whaledeck/agent.sock
      - /etc/whaledeck/agent-capability.key:/run/secrets/agent-capability.key:ro
    group_add:
      - "${WHALEDECK_AGENT_GID:?set WHALEDECK_AGENT_GID}"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      - whaledeck_frontend
      - authentik_frontend
      - postgres_backend
      - valkey_backend
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2g

  worker:
    <<: *service-defaults
    container_name: whaledeck-worker
    build:
      context: .
      dockerfile: src/WhaleDeck.Worker/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__WhaleDeck: Host=postgres;Port=5432;Database=${WHALEDECK_DB_NAME:-whaledeck};Username=${WHALEDECK_DB_USER:-whaledeck};Password=${WHALEDECK_DB_PASSWORD:?set WHALEDECK_DB_PASSWORD};Application Name=whaledeck-worker
      Valkey__Endpoint: valkey:6379
      Valkey__User: ${WHALEDECK_VALKEY_USER:-whaledeck}
      Valkey__Password: ${WHALEDECK_VALKEY_PASSWORD:?set WHALEDECK_VALKEY_PASSWORD}
      Agent__SocketPath: /run/whaledeck/agent.sock
      Agent__CapabilityKeyFile: /run/secrets/agent-capability.key
    volumes:
      - /run/whaledeck/agent.sock:/run/whaledeck/agent.sock
      - /etc/whaledeck/agent-capability.key:/run/secrets/agent-capability.key:ro
    group_add:
      - "${WHALEDECK_AGENT_GID:?set WHALEDECK_AGENT_GID}"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      - postgres_backend
      - valkey_backend
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1g

networks:
  whaledeck_frontend:
    name: whaledeck-app-ui
    internal: true
  authentik_frontend:
    name: database-platform-app-authentik
    external: true
  postgres_backend:
    name: database-platform-db-postgres
    external: true
  valkey_backend:
    name: database-platform-cache-general
    external: true
